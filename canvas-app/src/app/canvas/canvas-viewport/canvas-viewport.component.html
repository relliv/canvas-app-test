<div #containerEl class="canvas-container" (contextmenu)="onContextMenu($event)">
  <canvas #canvasEl class="canvas-layer"></canvas>

  <div
    class="overlay-layer"
    [style.transform]="overlayTransform()"
  >
    @for (block of visibleBlocks(); track block.id) {
      <cw-block-overlay
        [block]="block"
        [isSelected]="workspaceState.selectedBlockIds().has(block.id)"
        [isHovered]="hoveredBlockId() === block.id"
        [isFocused]="focusedBlockId() === block.id"
        [canvasZoom]="workspaceState.viewportState().zoom"
        (blockDragStart)="onOverlayDragStart($event)"
        (blockDragMove)="onOverlayDragMove($event)"
        (blockDragEnd)="onOverlayDragEnd()"
        (blockSelect)="onOverlaySelect($event)"
        (blockFocus)="onOverlayFocus($event)"
        (blockContextMenu)="onBlockContextMenu($event)"
      />
    }
  </div>
</div>

@if (contextMenuOpen()) {
  <cw-context-menu
    [items]="contextMenuItems()"
    [x]="contextMenuPos().x"
    [y]="contextMenuPos().y"
    (action)="onContextMenuAction($event)"
    (close)="onContextMenuClose()"
  />
}

@if (confirmDialogOpen()) {
  <div class="confirm-backdrop" (click)="onConfirmDialogCancel()">
    <div class="confirm-dialog" (click)="$event.stopPropagation()">
      <p class="confirm-message">{{ confirmDialogMessage() }}</p>
      <div class="confirm-actions">
        <button class="confirm-btn confirm-btn--cancel" (click)="onConfirmDialogCancel()">Cancel</button>
        <button class="confirm-btn confirm-btn--danger" (click)="onConfirmDialogAccept()">Delete</button>
      </div>
    </div>
  </div>
}
