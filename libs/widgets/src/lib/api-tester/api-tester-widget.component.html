<div class="api-widget">
  <div class="api-header" data-drag-handle>
    <span class="header-label">API Tester</span>
  </div>
  <div class="api-body" (pointerdown)="$event.stopPropagation()">
    <div class="req-row">
      <select class="method-select" [value]="config.method" (change)="onMethodChange($event)">
        @for (m of methods; track m) { <option [value]="m">{{ m }}</option> }
      </select>
      <input class="url-input" type="text" placeholder="https://api.example.com/data"
        [value]="config.url" (input)="onUrlChange($event)" />
      <button class="send-btn" [disabled]="loading()" (click)="sendRequest()">
        {{ loading() ? '...' : 'Send' }}
      </button>
    </div>
    <div class="section">
      <label class="section-label">Headers</label>
      <textarea class="code-area small" [value]="config.headers" (input)="onHeadersChange($event)"
        placeholder='{"Content-Type": "application/json"}'></textarea>
    </div>
    @if (config.method !== 'GET') {
      <div class="section">
        <label class="section-label">Body</label>
        <textarea class="code-area small" [value]="config.body" (input)="onBodyChange($event)"
          placeholder='{"key": "value"}'></textarea>
      </div>
    }
    <div class="section response-section">
      <label class="section-label">
        Response
        @if (config.status !== null) {
          <span class="status-badge" [class.ok]="config.status >= 200 && config.status < 300"
            [class.err]="config.status >= 400 || config.status === 0">
            {{ config.status }}
          </span>
        }
      </label>
      <pre class="response-body">{{ config.response || 'No response yet' }}</pre>
    </div>
  </div>
</div>
