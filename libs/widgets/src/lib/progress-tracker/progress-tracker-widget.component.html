<div class="pt-widget">
  <div class="pt-header" data-drag-handle>
    <div class="pt-title" contenteditable="true" spellcheck="false"
      [textContent]="config.title" (blur)="onTitleChange($event)"
      (pointerdown)="$event.stopPropagation()"></div>
    <span class="pt-percent">{{ progress }}%</span>
  </div>
  <div class="pt-bar-wrap">
    <div class="pt-bar" [style.width.%]="progress"></div>
  </div>
  <div class="pt-tasks">
    @for (task of config.tasks; track task.id) {
      <div class="pt-task" [class.done]="task.done">
        <button class="pt-check" (pointerdown)="$event.stopPropagation()" (click)="toggleTask(task.id)">
          {{ task.done ? '&#10003;' : '' }}
        </button>
        <div class="pt-text" contenteditable="true" spellcheck="false"
          [textContent]="task.text" (blur)="onTaskEdit(task.id, $event)"
          (pointerdown)="$event.stopPropagation()"></div>
        <button class="pt-remove" (pointerdown)="$event.stopPropagation()" (click)="removeTask(task.id)">x</button>
      </div>
    }
  </div>
  <button class="pt-add" (pointerdown)="$event.stopPropagation()" (click)="addTask()">+ Add task</button>
</div>
