<div class="text-editor-container">
  <div class="editor-header">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
    </svg>
    <span class="editor-title">Rich Text</span>
    <div class="editor-toolbar" (mousedown)="onToolbarMouseDown($event)">
      <button
        class="fmt-btn"
        [class.active]="editor?.isActive('bold')"
        (click)="toggleBold()"
        title="Bold"
      >B</button>
      <button
        class="fmt-btn fmt-btn--italic"
        [class.active]="editor?.isActive('italic')"
        (click)="toggleItalic()"
        title="Italic"
      >I</button>
      <button
        class="fmt-btn fmt-btn--strike"
        [class.active]="editor?.isActive('strike')"
        (click)="toggleStrike()"
        title="Strikethrough"
      >S</button>
      <span class="toolbar-sep"></span>
      <button
        class="fmt-btn"
        [class.active]="editor?.isActive('bulletList')"
        (click)="toggleBulletList()"
        title="Bullet List"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
      </button>
      <button
        class="fmt-btn"
        [class.active]="editor?.isActive('orderedList')"
        (click)="toggleOrderedList()"
        title="Ordered List"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="10" y1="6" x2="21" y2="6"/>
          <line x1="10" y1="12" x2="21" y2="12"/>
          <line x1="10" y1="18" x2="21" y2="18"/>
          <path d="M4 6h1v4"/>
          <path d="M4 10h2"/>
          <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/>
        </svg>
      </button>
      <button
        class="fmt-btn"
        [class.active]="editor?.isActive('codeBlock')"
        (click)="toggleCodeBlock()"
        title="Code Block"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="16 18 22 12 16 6"/>
          <polyline points="8 6 2 12 8 18"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="editor-content" tiptapEditor [editor]="editor"></div>
</div>
